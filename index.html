<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>charlie.cx</title>
<link rel="icon" id="favicon" type="image/jpeg" href="">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0c10; }
  #stage { position: relative; width: 100vw; height: 100vh; }
  @keyframes grain { 0%,100%{transform:translate(0,0)} 10%{transform:translate(-1%,-2%)} 20%{transform:translate(-3%,1%)} 30%{transform:translate(2%,-3%)} 40%{transform:translate(-2%,3%)} 50%{transform:translate(3%,1%)} 60%{transform:translate(1%,-1%)} 70%{transform:translate(-1%,2%)} 80%{transform:translate(2%,2%)} 90%{transform:translate(-3%,-1%)} }
  @keyframes iris { from { clip-path: circle(0% at 50% 50%); } to { clip-path: circle(75% at 50% 50%); } }
  @keyframes sweep { 0% { background-position: -160% 0; } 100% { background-position: 260% 0; } }
  @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-14px); } }
  @keyframes cha-pulse { 0%,100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1.15); } }
  @keyframes cha-cycle { 0%, 6% { opacity: 0; transform: translateY(6px); } 12%, 42% { opacity: 1; transform: translateY(0); } 48%, 100% { opacity: 0; transform: translateY(-6px); } }
  a { color: #f2c94c; }
  a:hover { color: #f2c94c; }
  #next { position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 50; display: flex; align-items: center; gap: 8px; cursor: pointer; background: rgba(11,12,16,0.72); font-family: 'SF Mono','JetBrains Mono',ui-monospace,monospace; color: #fff; border: 1px solid rgba(255,255,255,0.7); border-radius: 999px; padding: 6px 12px; margin: 0; }
  #next b { font-size: clamp(11px, 2.4vw, 14px); letter-spacing: 0.12em; text-transform: lowercase; font-weight: 400; }
  #next i { width: 1px; height: 12px; background: rgba(255,255,255,0.4); }
  #next > span { font-size: clamp(9px, 1.8vw, 11px); letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.9; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } #cha-pill span span { position: static !important; display: inline !important; opacity: 1 !important; } #cha-pill span span + span::before { content: ' / '; } #next .rot span + span { display: none !important; } }
  @media (max-width: 345px) { #next { bottom: calc(max(16px, env(safe-area-inset-bottom)) + 44px); } }
  #next .rot { display: inline-grid; }
  #next .rot span { grid-area: 1 / 1; animation: cha-cycle 5s infinite; }
  #next .rot span + span { animation-delay: 2.5s; animation-fill-mode: backwards; }
  #next:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
</style>
</head>
<body>
<div id="stage" role="img" aria-label="Cartoon portrait of Charlie that reacts to the mouse or touch. Use the next button for another effect."></div>
<div id="cha-pill" style="position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:16px;z-index:50;pointer-events:none;background:rgba(11,12,16,0.72);display:flex;align-items:center;gap:8px;font-family:'SF Mono','JetBrains Mono',ui-monospace,monospace;color:#fff;border:1px solid rgba(255,255,255,0.7);border-radius:999px;padding:6px 12px 6px 10px">
  <span style="width:6px;height:6px;border-radius:50%;background:#fff;animation:cha-pulse 1.8s ease-in-out infinite"></span>
  <span style="font-size:clamp(11px, 2.4vw, 14px);letter-spacing:0.12em;text-transform:lowercase">cha.01</span>
  <span style="width:1px;height:12px;background:rgba(255,255,255,0.4)"></span>
  <span style="position:relative;display:inline-block;min-width:64px;height:1.3em;font-size:clamp(9px, 1.8vw, 11px);letter-spacing:0.14em;text-transform:uppercase;opacity:0.9">
    <span style="position:absolute;inset:0;animation:cha-cycle 5s infinite">whatsapp</span>
    <span style="position:absolute;inset:0;animation:cha-cycle 5s infinite;animation-delay:2.5s">signal</span>
  </span>
</div>
<button id="next" type="button"><b>next</b><i></i><span class="rot"><span id="how"></span><span>for effect</span></span></button>
<script>
if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  const raf=requestAnimationFrame.bind(window);let until=performance.now()+5000;
  ['mousemove','mousedown','touchstart','touchmove','keydown','resize'].forEach(e=>addEventListener(e,()=>{until=performance.now()+5000},{passive:true}));
  const rq=cb=>raf(t=>{if(performance.now()<until)cb(t);else setTimeout(()=>rq(cb),200)});
  window.requestAnimationFrame=rq;
}
const nx=document.getElementById('next'),pill=document.getElementById('cha-pill'),st=document.getElementById('stage');
function fit(){
  const H=innerHeight,W=innerWidth;
  const R=H-Math.min(nx.getBoundingClientRect().top,pill.getBoundingClientRect().top)+8;
  st.style.height=((H-Math.min(W,H)*0.9)/2<R?H-R:H)+'px';
}
fit();addEventListener('resize',fit);
</script>

function effectBounce(root) {
  root.style.background = 'oklch(0.82 0.16 95)';
  root.style.cursor = 'none';
  const grain = document.createElement('div');
  grain.style.cssText = 'position:absolute;inset:0;opacity:0.05;background-image:radial-gradient(#000 1px, transparent 1px);background-size:3px 3px;animation:grain 0.4s steps(2) infinite;pointer-events:none';
  root.appendChild(grain);
  const logo = document.createElement('div');
  logo.style.cssText = 'position:absolute;top:0;left:0;width:220px;height:220px;border-radius:50%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.35);will-change:transform';
  const img = document.createElement('img');
  img.src = IMG; img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none';
  logo.appendChild(img); root.appendChild(logo);
  const size = 220; let x = 60, y = 60, vx = 2.6, vy = 2.1, rot = 0;
  const tick = () => {
    const w = root.clientWidth, h = root.clientHeight;
    x += vx; y += vy; rot += 0.6;
    if (x <= 0) { x = 0; vx = Math.abs(vx); }
    if (x + size >= w) { x = w - size; vx = -Math.abs(vx); }
    if (y <= 0) { y = 0; vy = Math.abs(vy); }
    if (y + size >= h) { y = h - size; vy = -Math.abs(vy); }
    logo.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function effectParticles(root) {
  root.style.background = '#0a0a0a';
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'display:block;width:100%;height:100%';
  root.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W, H;
  const resize = () => {
    W = root.clientWidth; H = root.clientHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize(); window.addEventListener('resize', resize);
  const img = new Image();
  img.onload = () => {
    const sampleSize = 340;
    const off = document.createElement('canvas'); off.width = sampleSize; off.height = sampleSize;
    const octx = off.getContext('2d'); octx.drawImage(img, 0, 0, sampleSize, sampleSize);
    const data = octx.getImageData(0, 0, sampleSize, sampleSize).data;
    const step = 4, cx = sampleSize/2, cy = sampleSize/2, particles = [];
    for (let py = 0; py < sampleSize; py += step) for (let px = 0; px < sampleSize; px += step) {
      const i = (py*sampleSize+px)*4;
      const boost = 1.35, lift = 60;
      const r = Math.min(255, data[i]*boost+lift), g = Math.min(255, data[i+1]*boost+lift), b = Math.min(255, data[i+2]*boost+lift), a = data[i+3];
      if (a < 40) continue;
      const dx = px-cx, dy = py-cy;
      if (Math.sqrt(dx*dx+dy*dy) > sampleSize/2+2) continue;
      particles.push({ ox:dx, oy:dy, x:Math.random()*W, y:Math.random()*H, vx:0, vy:0, color:`rgb(${r},${g},${b})`, phase:Math.random()*Math.PI*2, size:3.4 });
    }
    const scale = Math.min(W,H)*0.95/sampleSize;
    const mouse = { x:-9999, y:-9999 };
    root.addEventListener('mousemove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.clientX-r.left; mouse.y = e.clientY-r.top; });
    root.addEventListener('touchmove', e => { const r = canvas.getBoundingClientRect(); mouse.x = e.touches[0].clientX-r.left; mouse.y = e.touches[0].clientY-r.top; }, {passive:true});
    root.addEventListener('mouseleave', () => { mouse.x=-9999; mouse.y=-9999; });
    root.addEventListener('click', e => {
      const r = canvas.getBoundingClientRect(); const cx2 = e.clientX-r.left, cy2 = e.clientY-r.top;
      for (const p of particles) { const dx=p.x-cx2, dy=p.y-cy2; const dist=Math.max(Math.sqrt(dx*dx+dy*dy),1); const force=900/dist; p.vx+=(dx/dist)*force; p.vy+=(dy/dist)*force; }
    });
    const start = performance.now();
    const tick = (t) => {
      const elapsed = (t-start)/1000;
      ctx.clearRect(0,0,W,H);
      const centerX=W/2, centerY=H/2, repelRadius=90;
      for (const p of particles) {
        const jx = Math.sin(elapsed*1.3+p.phase)*0.8, jy = Math.cos(elapsed*1.1+p.phase)*0.8;
        const tx = centerX+p.ox*scale+jx, ty = centerY+p.oy*scale+jy;
        p.vx += (tx-p.x)*0.06; p.vy += (ty-p.y)*0.06;
        const dx=p.x-mouse.x, dy=p.y-mouse.y, dist=Math.sqrt(dx*dx+dy*dy);
        if (dist<repelRadius) { const force=(1-dist/repelRadius)*6; p.vx+=(dx/(dist||1))*force; p.vy+=(dy/(dist||1))*force; }
        p.vx*=0.88; p.vy*=0.88; p.x+=p.vx; p.y+=p.vy;
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  img.src = IMG;
}

function effectRipple(root) {
  root.style.display = 'flex'; root.style.alignItems = 'center'; root.style.justifyContent = 'center';
  root.style.background = 'radial-gradient(circle at 50% 45%, #16181d 0%, #0b0c10 70%)';
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'border-radius:50%;box-shadow:0 30px 90px rgba(0,0,0,0.6);cursor:pointer';
  root.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const SIM = 360; canvas.width = SIM; canvas.height = SIM;
  const applyCssSize = () => { const s = Math.min(Math.min(root.clientWidth, root.clientHeight)*0.72, 620); canvas.style.width = s+'px'; canvas.style.height = s+'px'; };
  applyCssSize(); window.addEventListener('resize', applyCssSize);
  const off = document.createElement('canvas'); off.width = SIM; off.height = SIM;
  const octx = off.getContext('2d');
  const img = new Image();
  img.onload = () => {
    const iw = img.width, ih = img.height, scale = Math.max(SIM/iw, SIM/ih), dw = iw*scale, dh = ih*scale;

    for (let k = 0; k < 8; k++) { const y = cy + R * 0.05 + (k + ph / 1600 % 1) * R * 0.14; ctx.fillRect(cx - R, y, R * 2, 1 + (y - cy) * 0.07); }
    ctx.fillStyle = '#1a0536'; ctx.beginPath(); ctx.moveTo(0, hz);
    for (let x = 0; x <= W; x += 8) ctx.lineTo(x, hz - (Math.abs(Math.sin(x / W * 7 + vx * 3)) * 0.6 + Math.sin(x / W * 19 + 1) * 0.2 + 0.2) * H * 0.09);
    ctx.lineTo(W, hz); ctx.fill(); ctx.restore();
    const fl = ctx.createLinearGradient(0, hz, 0, H); fl.addColorStop(0, '#2a0850'); fl.addColorStop(1, '#0d0221');
    ctx.fillStyle = fl; ctx.fillRect(0, hz, W, H - hz);
    ctx.strokeStyle = '#ff2ec4'; ctx.shadowColor = '#ff2ec4'; ctx.shadowBlur = 10; ctx.lineWidth = 1.5;
    const vp = W * (0.5 + (vx - 0.5) * 0.6);
    ctx.beginPath();
    for (let j = -24; j <= 24; j++) { ctx.moveTo(vp, hz); ctx.lineTo(vp + j * W * 0.14, H); }
    ctx.stroke();
    for (let i = 0; i < 14; i++) { const z = (i + ph / 600 % 1) / 14, y = hz + (H - hz) * z * z; ctx.lineWidth = 0.5 + z * 2.5; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.shadowBlur = 0;
  });
}

function effectReflection(root) {
  const o = mkCanvas(root), m = track(root), ctx = o.ctx;
  let src = null;
  withImg(s => { src = s; });
  loop(t => {
    const { W, H } = o, S = Math.min(W * 0.8, H * 0.44), x0 = (W - S) / 2, y0 = (H - 1.8 * S) / 2 + S * 0.05, base = y0 + S;
    const sky = ctx.createLinearGradient(0, 0, 0, base); sky.addColorStop(0, '#0a1b33'); sky.addColorStop(1, '#2d5f8a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, base);
    const wt = ctx.createLinearGradient(0, base, 0, H); wt.addColorStop(0, '#16415f'); wt.addColorStop(1, '#06101c');
    ctx.fillStyle = wt; ctx.fillRect(0, base, W, H - base);
    if (!src) return;
    ctx.drawImage(src, x0, y0, S, S);
    const step = 2, n = Math.floor(S * 0.85 / step), k = 512 / S;
    for (let i = 0; i < n; i++) {
      const dy = i * step, near = m.on ? Math.exp(-(((base + dy - m.y) / 45) ** 2)) : 0;
      const off = Math.sin(dy * 0.16 - t / 280) * (1.5 + dy * 0.05) + Math.sin(dy * 0.5 - t / 110) * 14 * near * (m.down ? 2 : 1);
      ctx.globalAlpha = 0.65 * (1 - dy / (S * 0.85));
      ctx.drawImage(src, 0, 512 - (dy + step) * k, 512, step * k, x0 + off, base + dy, S, step);
    }
    ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(x0, base, S, 1);
  });
}

function effectPopArt(root) {
  root.style.background = '#111';
  const o = mkCanvas(root), ctx = o.ctx, m = track(root), n = 200;
  const P = [['#1b1b3a', '#e4007c', '#ffd400', '#fff7e0'], ['#0b3d91', '#ff5a1f', '#ffe14d', '#f4f4f4'], ['#2b0a3d', '#00b8a9', '#f6416c', '#ffde7d'], ['#101820', '#7bd389', '#f2c94c', '#fdfcdc'], ['#3a0ca3', '#4cc9f0', '#f72585', '#ffffff'], ['#2d2d2d', '#ff3b3b', '#ffc300', '#faf3dd']];
  let cv = null;
  const dots = document.createElement('canvas'); dots.width = dots.height = 6;
  const dx = dots.getContext('2d'); dx.fillStyle = '#000'; dx.beginPath(); dx.arc(3, 3, 1.4, 0, 6.283); dx.fill();
  const pat = o.ctx.createPattern(dots, 'repeat');
  withImg(s => {
    const d = sampleImg(s, n).d;
    cv = P.map(p => {
      const c = document.createElement('canvas'); c.width = c.height = n;
      const x = c.getContext('2d'), im = x.createImageData(n, n), q = new Uint32Array(im.data.buffer);
      const col = p.map(h => { const v = parseInt(h.slice(1), 16); return (0xff000000 | (v & 255) << 16 | (v >> 8 & 255) << 8 | v >> 16) >>> 0; });
      for (let i = 0; i < n * n; i++) q[i] = col[Math.min(3, Math.max(0, (lum(d, i * 4) - 0.1) / 0.75) * 4 | 0)];
      x.putImageData(im, 0, 0); return c;
    });
  });
  loop(t => {
    const { W, H } = o, gap = 8, c = (Math.min(W, H) * 0.92 - gap) / 2, x0 = (W - 2 * c - gap) / 2, y0 = (H - 2 * c - gap) / 2, step = t / 1400 | 0;
    ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
    if (!cv) return;
    for (let i = 0; i < 4; i++) {
      const x = x0 + (i % 2) * (c + gap), y = y0 + (i >> 1) * (c + gap), hot = m.on && m.x > x && m.x < x + c && m.y > y && m.y < y + c;
      ctx.drawImage(cv[(i + step + (hot ? t / 260 | 0 : 0)) % 6], x, y, c, c);
      ctx.globalAlpha = 0.14; ctx.fillStyle = pat; ctx.fillRect(x, y, c, c); ctx.globalAlpha = 1;
      ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.strokeRect(x, y, c, c);
    }
  });
}

function effectThermal(root) {
  root.style.background = '#000';
  const N = 240, { ctx, m } = sq(root, N, false, 0.92), st = [[0, 0, 0, 0], [0.2, 40, 0, 90], [0.45, 200, 20, 60], [0.7, 255, 150, 0], [0.9, 255, 240, 80], [1, 255, 255, 255]], pal = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    const v = i / 255; let k = 1; while (st[k][0] < v) k++;
    const a = st[k - 1], b = st[k], f = (v - a[0]) / (b[0] - a[0]), c = j => a[j] + (b[j] - a[j]) * f;
    pal[i] = (0xff000000 | c(3) << 16 | c(2) << 8 | c(1)) >>> 0;
  }
  withImg(s => {
    const d = sampleImg(s, N).d, out = ctx.createImageData(N, N), dst = new Uint32Array(out.data.buffer), heat = new Float32Array(N * N);
    let px = 0.5, py = 0.5;
    loop(t => {
      px += ((m.on ? m.x : 0.5 + Math.sin(t / 1900) * 0.3) - px) * 0.12; py += ((m.on ? m.y : 0.5 + Math.cos(t / 2300) * 0.3) - py) * 0.12;
      const cx = px * N, cy = py * N, R = m.down ? 40 : 22, x0 = Math.max(0, cx - R | 0), x1 = Math.min(N - 1, cx + R | 0), y0 = Math.max(0, cy - R | 0), y1 = Math.min(N - 1, cy + R | 0);
      for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const q = ((x - cx) ** 2 + (y - cy) ** 2) / (R * R); if (q < 1) heat[y * N + x] = Math.min(0.6, heat[y * N + x] + (1 - q) * 0.06); }
      for (let i = 0; i < N * N; i++) { heat[i] *= 0.985; dst[i] = pal[Math.max(0, Math.min(1, lum(d, i * 4) * 0.7 + heat[i] + (Math.random() - 0.5) * 0.04)) * 255 | 0]; }
      ctx.putImageData(out, 0, 0);
      const ci = Math.min(N - 1, cy | 0) * N + Math.min(N - 1, cx | 0), tv = Math.min(1, lum(d, ci * 4) * 0.7 + heat[ci]);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; circle(ctx, cx, cy, 9); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx - 15, cy); ctx.lineTo(cx - 5, cy); ctx.moveTo(cx + 5, cy); ctx.lineTo(cx + 15, cy); ctx.moveTo(cx, cy - 15); ctx.lineTo(cx, cy - 5); ctx.moveTo(cx, cy + 5); ctx.lineTo(cx, cy + 15); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '10px monospace'; ctx.fillText((20 + tv * 40).toFixed(1) + ' C', Math.min(N - 50, cx + 14), Math.max(12, cy - 12));
    });
  });
}

function effectPrism(root) {
  root.style.background = '#050507';
  const o = mkCanvas(root), m = track(root), ctx = o.ctx, hist = [];
  let ch = null, px = 0, py = 0;
  withImg(s => {
    const d = sampleImg(s, 512).d;
    ch = [0, 1, 2].map(c => {
      const cv = document.createElement('canvas'); cv.width = cv.height = 512;
      const x = cv.getContext('2d'), im = x.createImageData(512, 512);
      for (let i = 0; i < 512 * 512; i++) { im.data[i * 4 + c] = d[i * 4 + c]; im.data[i * 4 + 3] = 255; }
      x.putImageData(im, 0, 0); return cv;
    });
  });
  loop(t => {
    const { W, H } = o, S = Math.min(W, H) * 0.78;
    ctx.fillStyle = '#050507'; ctx.fillRect(0, 0, W, H);
    if (!ch) return;
    const tx = m.on ? W / 2 + (m.x - W / 2) * 0.5 : W / 2 + Math.sin(t / 1100) * W * 0.18, ty = m.on ? H / 2 + (m.y - H / 2) * 0.5 : H / 2 + Math.cos(t / 1500) * H * 0.12;
    if (!hist.length) { px = tx; py = ty; hist.push(...Array(20).fill([tx, ty])); }
    px += (tx - px) * (m.down ? 0.04 : 0.12); py += (ty - py) * (m.down ? 0.04 : 0.12);
    hist.unshift([px, py]); hist.pop();
    ctx.globalCompositeOperation = 'lighter';
    ch.forEach((c, i) => { const h = hist[Math.min(hist.length - 1, i * (m.down ? 9 : 6))]; ctx.drawImage(c, h[0] - S / 2, h[1] - S / 2, S, S); });
    ctx.globalCompositeOperation = 'source-over';
  });
}

const effects = [effectBounce, effectParticles, effectRipple, effectTilt, effectMosaic, effectMagnifier, effectKaleidoscope, effectFrost, effectOrbit, effectPixelate, effectGlitch, effectAscii, effectHalftone, effectWarp, effectSwirl, effectSpotlight, effectShatter, effectCrt, effectWave, effectCube, effectGravity, effectSnow, effectTrail, effectTunnel, effectHologram, effectBlackHole, effectGlobe, effectMatrix, effectLiquid, effectNeon, effectSynthwave, effectReflection, effectPopArt, effectThermal, effectPrism];
const names = ['bounce','particles','ripple','tilt','mosaic','magnifier','kaleidoscope','frost','orbit','pixelate','glitch','ascii','halftone','warp','swirl','spotlight','shatter','CRT','wave','cube','gravity','snow globe','trail','tunnel','hologram','black hole','globe','matrix','liquid','neon','synthwave','reflection','pop art','thermal','prism'];
const want = parseInt(location.hash.slice(1), 10) - 1;
const pick = want >= 0 && want < effects.length ? want : Math.floor(Math.random() * effects.length);
effects[pick](stage);
document.getElementById('next').setAttribute('aria-label', 'Next effect. Now showing ' + names[pick] + ', ' + (pick + 1) + ' of ' + effects.length + '.');
document.getElementById('how').textContent = matchMedia('(hover: hover)').matches ? 'hover image' : 'touch image';
document.getElementById('next').onclick = () => { location.hash = (pick + 1) % effects.length + 1; };
addEventListener('hashchange', () => location.reload());
</script>
